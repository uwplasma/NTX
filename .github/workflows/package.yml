name: package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: ntx-dist
          path: dist/*

  smoke-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: ntx-dist
          path: dist
      - name: Install wheel and smoke-test entrypoints
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          ntx --help
          python -m ntx --help
          python -c "import ntx; from ntx import GridSpec; print(GridSpec(5, 5, 4))"

  smoke-install-sdist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: ntx-dist
          path: dist
      - name: Install sdist and smoke-test entrypoints
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          ntx --help
          python -m ntx --help
