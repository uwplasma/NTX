name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,io,vmex,booz]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ntx

  test-shards:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 30
    env:
      JAX_ENABLE_X64: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"pr1","lanes":"heavy_examples_derivatives core_validation core_foundation core_cli_workflows core_profile_audit_workflow core_robust_bootstrap_workflow heavy_examples_boundary"},{"name":"pr2","lanes":"heavy_examples_profiles core_adjoint core_profile_basic_workflows core_io_workflows core_neopax_workflows core_parallel_workflows"},{"name":"pr3","lanes":"core_profile_optimization_workflows core_profile_transport_workflows heavy_examples_publication integration_examples core_autodiff_uncertainty_workflow"}]' || '[{"name":"core_foundation","lanes":"core_foundation"},{"name":"core_adjoint","lanes":"core_adjoint"},{"name":"core_cli_workflows","lanes":"core_cli_workflows"},{"name":"core_io_workflows","lanes":"core_io_workflows"},{"name":"core_parallel_workflows","lanes":"core_parallel_workflows"},{"name":"core_neopax_workflows","lanes":"core_neopax_workflows"},{"name":"core_profile_audit_workflow","lanes":"core_profile_audit_workflow"},{"name":"core_profile_basic_workflows","lanes":"core_profile_basic_workflows"},{"name":"core_profile_optimization_workflows","lanes":"core_profile_optimization_workflows"},{"name":"core_profile_transport_workflows","lanes":"core_profile_transport_workflows"},{"name":"core_autodiff_uncertainty_workflow","lanes":"core_autodiff_uncertainty_workflow"},{"name":"core_robust_bootstrap_workflow","lanes":"core_robust_bootstrap_workflow"},{"name":"core_validation","lanes":"core_validation"},{"name":"integration_examples","lanes":"integration_examples"},{"name":"heavy_examples_profiles","lanes":"heavy_examples_profiles"},{"name":"heavy_examples_derivatives","lanes":"heavy_examples_derivatives"},{"name":"heavy_examples_boundary","lanes":"heavy_examples_boundary"},{"name":"heavy_examples_publication","lanes":"heavy_examples_publication"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,io,vmex,booz]"
      - name: Test shard
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/test_lane_manifest.py --check
          : > "$RUNNER_TEMP/ntx-tests.txt"
          for lane in ${{ matrix.lanes }}; do
            python scripts/test_lane_manifest.py "$lane" >> "$RUNNER_TEMP/ntx-tests.txt"
          done
          xargs pytest -q -m "not gpu" --cov=src/ntx --cov-report= < "$RUNNER_TEMP/ntx-tests.txt"
          python - <<'PY'
          from pathlib import Path
          import shutil

          out = Path("coverage-data")
          out.mkdir(exist_ok=True)
          copied = 0
          for index, path in enumerate(sorted(Path(".").glob(".coverage*"))):
              if path.is_file():
                  shutil.copy2(path, out / f"coverage.{index}")
                  copied += 1
          if copied == 0:
              raise SystemExit("no shard coverage data written")
          PY
      - name: Upload shard coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: coverage-data

  coverage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-shards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Combine and summarize coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("coverage-artifacts")
          copied = 0
          for index, path in enumerate(sorted(root.rglob("coverage.*"))):
              target = Path(f".coverage.shard{index}")
              shutil.copy2(path, target)
              copied += 1
          if copied == 0:
              raise SystemExit("no shard coverage files found")
          PY
          coverage combine
          coverage json -o coverage.json
          python scripts/build_coverage_report.py \
            --json-input coverage.json \
            --json-output coverage-report.json \
            --text-output coverage-report.txt
          cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.json
            coverage-report.json
            coverage-report.txt

  compatibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,io,vmex,booz]"
      - name: Compatibility subset
        run: |
          pytest -q \
            tests/test_cli.py \
            tests/test_packaging.py \
            tests/test_inputfiles_unit.py \
            tests/test_solver.py \
            tests/test_neopax_arrays.py \
            -m "not gpu"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,vmex,booz]"
      - name: Docs
        run: sphinx-build -b html docs docs/_build/html

  gpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    timeout-minutes: 5
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,vmex]" "jax[cuda12]"
      - name: Check backend
        run: |
          uv run --no-sync python -c "import jax; assert jax.default_backend() == 'gpu', jax.devices(); assert jax.config.jax_enable_x64; assert jax.numpy.zeros(1).dtype == jax.numpy.float64"
      - name: GPU tests
        timeout-minutes: 1
        run: uv run --no-sync pytest -m gpu -q -x tests/test_gpu_smoke.py
