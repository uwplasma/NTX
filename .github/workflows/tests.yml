name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ntx || true
      - name: Test
        run: pytest -m "not gpu"
      - name: Docs
        run: sphinx-build -b html docs docs/_build/html
