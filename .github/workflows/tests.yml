name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ntx

  test-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["core", "integration_examples", "heavy_examples"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Test shard
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            heavy_examples)
              pytest -q -m "not gpu" --cov=src/ntx --cov-report= \
                tests/test_ambipolar_profile_example.py \
                tests/test_ambipolar_profile_family_example.py \
                tests/test_bootstrap_current_optimization_example.py \
                tests/test_derivative_audit_example.py \
                tests/test_derivative_path_benchmark_example.py \
                tests/test_make_publication_figures.py \
                tests/test_manuscript_artifacts_script.py \
                tests/test_performance_scaling_example.py \
                tests/test_primitive_profile_transport_example.py \
                tests/test_profile_basis_optimization_example.py \
                tests/test_profile_control_optimization_example.py \
                tests/test_profile_transport_loop_example.py \
                tests/test_validation_summary_example.py
              ;;
            integration_examples)
              pytest -q -m "not gpu" --cov=src/ntx --cov-report= \
                tests/test_bootstrap_current_reference_audit_w7x.py \
                tests/test_bootstrap_current_vmec_or_boozmn_example.py \
                tests/test_bootstrap_current_with_neopax_example.py \
                tests/test_plot_output_npz_example.py \
                tests/test_profile_fixed_field_workflow_script.py \
                tests/test_profile_w7x_integrated_workflow_script.py \
                tests/test_precise_qs_redl_sfincs_audit.py
              ;;
            core)
              python -c 'from pathlib import Path; excluded = {"test_ambipolar_profile_example.py", "test_ambipolar_profile_family_example.py", "test_bootstrap_current_optimization_example.py", "test_derivative_audit_example.py", "test_derivative_path_benchmark_example.py", "test_make_publication_figures.py", "test_manuscript_artifacts_script.py", "test_performance_scaling_example.py", "test_primitive_profile_transport_example.py", "test_profile_basis_optimization_example.py", "test_profile_control_optimization_example.py", "test_profile_transport_loop_example.py", "test_validation_summary_example.py", "test_bootstrap_current_reference_audit_w7x.py", "test_bootstrap_current_vmec_or_boozmn_example.py", "test_bootstrap_current_with_neopax_example.py", "test_plot_output_npz_example.py", "test_profile_fixed_field_workflow_script.py", "test_profile_w7x_integrated_workflow_script.py", "test_precise_qs_redl_sfincs_audit.py"}; [print(path) for path in sorted(Path("tests").glob("test_*.py")) if path.name not in excluded]' > /tmp/ntx-core-tests.txt
              xargs pytest -q -m "not gpu" --cov=src/ntx --cov-report= < /tmp/ntx-core-tests.txt
              ;;
          esac
      - name: Upload shard coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage

  coverage-report:
    runs-on: ubuntu-latest
    needs: test-shards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Combine and summarize coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("coverage-artifacts")
          copied = 0
          for path in root.rglob(".coverage"):
              shard = path.parent.name
              target = Path(f".coverage.{shard}")
              shutil.copy2(path, target)
              copied += 1
          if copied == 0:
              raise SystemExit("no shard coverage files found")
          PY
          coverage combine
          coverage json -o coverage.json
          python scripts/build_coverage_report.py \
            --json-input coverage.json \
            --json-output coverage-report.json \
            --text-output coverage-report.txt
          cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.json
            coverage-report.json
            coverage-report.txt

  compatibility-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Compatibility subset
        run: |
          pytest -q \
            tests/test_cli.py \
            tests/test_packaging.py \
            tests/test_inputfiles_unit.py \
            tests/test_solver.py \
            tests/test_neopax_arrays.py \
            -m "not gpu"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[docs]"
      - name: Docs
        run: sphinx-build -b html docs docs/_build/html
