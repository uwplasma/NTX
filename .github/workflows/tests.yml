name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/VMEX.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ntx

  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core_foundation
          - core_cli_workflows
          - core_io_workflows
          - core_parallel_workflows
          - core_neopax_workflows
          - core_profile_audit_workflow
          - core_profile_basic_workflows
          - core_profile_optimization_workflows
          - core_profile_transport_workflows
          - core_autodiff_uncertainty_workflow
          - core_robust_bootstrap_workflow
          - core_validation
          - integration_examples
          - heavy_examples_profiles
          - heavy_examples_derivatives
          - heavy_examples_boundary
          - heavy_examples_publication
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/VMEX.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Test shard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_lane_manifest.py --check
          python scripts/test_lane_manifest.py "${{ matrix.shard }}" > /tmp/ntx-tests.txt
          xargs pytest -q -m "not gpu" --cov=src/ntx --cov-report= < /tmp/ntx-tests.txt
          python - <<'PY'
          from pathlib import Path
          import shutil

          out = Path("coverage-data")
          out.mkdir(exist_ok=True)
          copied = 0
          for index, path in enumerate(sorted(Path(".").glob(".coverage*"))):
              if path.is_file():
                  shutil.copy2(path, out / f"coverage.{index}")
                  copied += 1
          if copied == 0:
              raise SystemExit("no shard coverage data written")
          PY
      - name: Upload shard coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-data

  coverage-report:
    runs-on: ubuntu-latest
    needs: test-shards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Combine and summarize coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("coverage-artifacts")
          copied = 0
          for index, path in enumerate(sorted(root.rglob("coverage.*"))):
              target = Path(f".coverage.shard{index}")
              shutil.copy2(path, target)
              copied += 1
          if copied == 0:
              raise SystemExit("no shard coverage files found")
          PY
          coverage combine
          coverage json -o coverage.json
          python scripts/build_coverage_report.py \
            --json-input coverage.json \
            --json-output coverage-report.json \
            --text-output coverage-report.txt
          cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.json
            coverage-report.json
            coverage-report.txt

  compatibility-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/VMEX.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Compatibility subset
        run: |
          pytest -q \
            tests/test_cli.py \
            tests/test_packaging.py \
            tests/test_inputfiles_unit.py \
            tests/test_solver.py \
            tests/test_neopax_arrays.py \
            -m "not gpu"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/VMEX.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[docs]"
      - name: Docs
        run: sphinx-build -b html docs docs/_build/html
