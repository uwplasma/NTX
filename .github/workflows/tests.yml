name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ntx
      - name: Test
        run: pytest -q -m "not gpu"

  compatibility-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[dev,io]"
      - name: Compatibility subset
        run: |
          pytest -q \
            tests/test_cli.py \
            tests/test_packaging.py \
            tests/test_inputfiles_unit.py \
            tests/test_solver.py \
            tests/test_neopax_arrays.py \
            -m "not gpu"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/uwplasma/vmec_jax.git \
            git+https://github.com/uwplasma/booz_xform_jax.git
          python -m pip install -e ".[docs]"
      - name: Docs
        run: sphinx-build -b html docs docs/_build/html
