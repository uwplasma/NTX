[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntx"
version = "0.1.0"
description = "JAX-native monoenergetic neoclassical transport solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "UW Plasma" }
]
keywords = ["jax", "stellarator", "neoclassical", "transport", "plasma-physics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax",
  "jaxlib",
  "interpax",
  "numpy",
  "rich",
  "scipy",
  "typing-extensions",
  "tomli; python_version < '3.11'",
]

[project.urls]
Documentation = "https://ntx.readthedocs.io"
Changelog = "https://github.com/uwplasma/NTX/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
  "twine",
  "mypy",
]
docs = [
  "sphinx",
  "myst-parser",
  "sphinx-rtd-theme",
]
geometry = [
  "vmec_jax @ git+https://github.com/uwplasma/vmec_jax.git",
  "booz_xform_jax @ git+https://github.com/uwplasma/booz_xform_jax.git",
]
io = [
  "h5py",
  "netCDF4",
]

[project.scripts]
ntx = "ntx.cli:main"

[tool.hatch.build]
exclude = [
  "/.github",
  "/docs/_build",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ntx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: tests that require a JAX GPU device",
  "benchmark: tests that require external benchmark data or executables",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["ntx"]
ignore_missing_imports = true
warn_unused_ignores = true
