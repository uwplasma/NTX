[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntx"
version = "0.2.4"
description = "JAX-native monoenergetic neoclassical transport solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "UW Plasma" }
]
keywords = ["jax", "stellarator", "neoclassical", "transport", "plasma-physics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax",
  "netCDF4",
  "numpy",
  "rich",
  # The bounded reverse pass needs the params/adjoint_window arguments on
  # block_thomas_truncated_fn_with_residual (SOLVAX >= 0.11.0).
  "solvax>=0.12.0",
  "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/uwplasma/NTX"
Repository = "https://github.com/uwplasma/NTX"
Documentation = "https://ntx.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
  "build",
  "coverage[toml]",
  "scipy",
  "matplotlib",
  "pytest",
  "pytest-cov",
  "ruff",
  "scipy",
  "twine",
  "mypy",
]
docs = [
  "matplotlib",
  "sphinx",
  "myst-parser",
  "sphinx-rtd-theme",
]
io = [
  "f90nml",
  "h5py",
]

[project.scripts]
ntx = "ntx.cli:main"

[tool.hatch.build]
exclude = [
  "/.github",
  "/docs/_build",
  "/docs/_static",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ntx"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: tests that require a JAX GPU device",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: it is checked against whatever interpreter runs, and
# pinning 3.10 made mypy parse the installed numpy stubs under 3.10 rules,
# where they use 3.12 type syntax. The gate then failed inside numpy and
# checked none of NTX -- a type check that reports an error it cannot act on
# and silently skips the code it exists to cover.
packages = ["ntx"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
parallel = true
source = ["src/ntx"]

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 1

[tool.coverage.json]
pretty_print = true
