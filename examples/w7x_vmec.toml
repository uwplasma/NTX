[surface]
type = "vmec"
path = "../tests/fixtures/wout_w7x_standardConfig.nc"
psi_n = 0.25
vmec_radial_option = 0
vmec_nyquist_option = 1
min_bmn_to_load = 0.0

[grid]
n_theta = 9
n_zeta = 11
n_xi = 8
dtype = "float64"
x64 = true

[case]
nu_hat = 1e-3
epsi_hat = 1e-3

[output]
npz = "outputs/w7x_vmec.npz"
include_modes = true

[logging]
verbose = true
